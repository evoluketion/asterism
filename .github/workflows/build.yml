name: Build

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux
            files: dist/*.AppImage
          - os: windows-2025
            target: win
            files: dist/*-Setup.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Set version from tag
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: npm version --no-git-tag-version --allow-same-version "${TAG#v}"

      - name: Install
        run: npm ci

      - name: Test
        if: matrix.target == 'linux'
        run: npm test

      - name: Build
        run: npm run dist:${{ matrix.target }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: asterism-${{ matrix.target }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: asterism-*
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=""
          case "$TAG" in *-*) flags="--prerelease" ;; esac
          files=(*.AppImage *-Setup.exe)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" --verify-tag --generate-notes $flags
          fi
